<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Услуги</title>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 100px; }
        a { margin: 0 15px; font-size: 18px; color: #007BFF; text-decoration: none; }

                /* Стиль для ссылки «На главную» */
        .home-link {
            position: absolute;
            bottom: 50px;
            right: 50px;
            background: rgba(93, 207, 119, 0.9);
            color: #2c3e50;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 3px 3px 8px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            backdrop-filter: blur(5px); /* лёгкое размытие фона */
        }

        .home-link:hover {
            background: rgba(255, 255, 255, 1);
            transform: scale(1.05);
            box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <h1>Перечень услуг для возможного сотрудничества</h1>
    <p>Что то <p>
    <p>Что то еще</p>
    
    <!-- Ссылка «На главную» в правом нижнем углу -->
    <a href="/" class="home-link">На главную</a>
</body>
</html>
